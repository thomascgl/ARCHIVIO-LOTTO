name: Aggiornamento Automatico Estrazioni

on:
  schedule:
    - cron: '27 20 * * *'
  
  # Ti permette di avviare l'aggiornamento a mano quando vuoi dalla scheda "Actions" di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice del repository
      uses: actions/checkout@v4

    - name: Prepara Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa le librerie
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Esegui lo script Python
      run: python update_script.py

    - name: Salva le modifiche sul JSON su GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add estrazioni.json
        
        # Effettua il commit e il push SOLO se ci sono modifiche effettive
        if ! git diff-index --quiet HEAD; then
          git commit -m "Auto-update estrazioni Lotto"
          git push origin HEAD:${{ github.ref_name }}
        else
          echo "Nessuna modifica da salvare."
        fi
