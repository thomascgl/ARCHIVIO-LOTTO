name: Aggiornamento Automatico Estrazioni

on:
  schedule:
    # Esegue nei giorni di estrazione (Martedì, Giovedì, Venerdì, Sabato) alle 20:30 UTC
    - cron: '30 20 * * 2,4,5,6'
  
  # Permette l'avvio manuale
  workflow_dispatch:

# Autorizza le GitHub Actions a scrivere nel repository (risolve l'exit code 128)
permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # Aggiornato a v4 (risolve l'avviso Node.js)
    - name: Scarica il codice del repository
      uses: actions/checkout@v4

    # Aggiornato a v5 (risolve l'avviso Node.js)
    - name: Prepara Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa le librerie
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Esegui lo script Python
      run: python update_script.py

    - name: Salva le modifiche sul JSON su GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add estrazioni.json
        git diff-index --quiet HEAD || git commit -m "Auto-update estrazioni Lotto [ADM]"
        git push
