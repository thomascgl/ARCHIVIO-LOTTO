name: Aggiornamento Automatico Estrazioni

on:
  schedule:
    # Esegue lo script nei giorni di estrazione (Martedì, Giovedì, Venerdì, Sabato) alle 20:30 UTC
    - cron: '30 20 * * 2,4,5,6'
  
  # Ti permette di avviare l'aggiornamento a mano quando vuoi dalla dashboard di GitHub
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice del repository
      uses: actions/checkout@v3

    - name: Prepara Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Installa le librerie
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Esegui lo script Python
      run: python update_script.py

    - name: Salva le modifiche sul JSON su GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add estrazioni.json
        git diff-index --quiet HEAD || git commit -m "Auto-update estrazioni Lotto [ADM]"
        git push
